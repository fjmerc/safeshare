    UpdateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [user, admin]

    # ==================== Webhook Schemas ====================
    WebhookConfig:
      type: object
      properties:
        id:
          type: integer
        url:
          type: string
          format: uri
        secret:
          type: string
          description: Masked in list responses
        service_token:
          type: string
          description: Masked in list responses
        enabled:
          type: boolean
        events:
          type: array
          items:
            type: string
            enum: [file.uploaded, file.downloaded, file.deleted, file.expired]
        format:
          type: string
          enum: [safeshare, gotify, ntfy, discord]
        max_retries:
          type: integer
        timeout_seconds:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateWebhookRequest:
      type: object
      required:
        - url
        - secret
        - enabled
        - events
      properties:
        url:
          type: string
          format: uri
          description: Webhook endpoint URL (HTTP/HTTPS only)
        secret:
          type: string
          description: Secret key for HMAC signature verification
        service_token:
          type: string
          description: Authentication token for Gotify/ntfy services
        enabled:
          type: boolean
        events:
          type: array
          items:
            type: string
            enum: [file.uploaded, file.downloaded, file.deleted, file.expired]
          minItems: 1
        format:
          type: string
          enum: [safeshare, gotify, ntfy, discord]
          default: safeshare
        max_retries:
          type: integer
          default: 5
        timeout_seconds:
          type: integer
          default: 30

    WebhookTestResponse:
      type: object
      properties:
        success:
          type: boolean
        response_code:
          type: integer
        response_body:
          type: string
        error:
          type: string
          description: Present on failure

    WebhookDelivery:
      type: object
      properties:
        id:
          type: integer
        webhook_config_id:
          type: integer
        event_type:
          type: string
        payload:
          type: string
          description: JSON payload
        attempt_count:
          type: integer
        status:
          type: string
          enum: [pending, success, failed, retrying]
        response_code:
          type: integer
          nullable: true
        response_body:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        next_retry_at:
          type: string
          format: date-time
          nullable: true
