openapi: 3.0.3
info:
  title: SafeShare API
  description: |
    SafeShare is a secure file sharing service with support for large file uploads, 
    password protection, expiration controls, and enterprise features.
    
    ## Authentication
    
    SafeShare supports two authentication methods:
    
    ### Session Cookie Authentication
    Traditional web session using `user_session` cookie. Obtained via `/api/auth/login`.
    
    ### API Token Authentication (Bearer)
    For SDKs, CLIs, and automation. Include token in Authorization header:
    ```
    Authorization: Bearer safeshare_<token>
    ```
    
    API tokens support granular scopes: `upload`, `download`, `manage`, `admin`.
    
    ## Rate Limiting
    
    Rate limits are applied per IP address:
    - Uploads: Configurable (default: 10/hour)
    - Downloads: Configurable (default: 50/hour)
    - Login attempts: 5 per 15 minutes
    - Chunked upload: `/init` at the upload limit, `/chunk` and `/complete` at
      10x it, `/status` at 600x it (never under 6000/hour)

    When rate limited, endpoints return `429 Too Many Requests`.

  version: 1.12.0
  contact:
    name: SafeShare Support
    url: https://github.com/fjmerc/safeshare
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Development server
  - url: https://yourdomain.com
    description: Production server

tags:
  - name: Health
    description: Health check and monitoring endpoints
  - name: Configuration
    description: Public configuration endpoints
  - name: Authentication
    description: User and admin authentication
  - name: Files
    description: File upload and download operations
  - name: Chunked Upload
    description: Large file chunked upload operations
  - name: User Files
    description: User file management operations
  - name: API Tokens
    description: API token management for programmatic access
  - name: Admin
    description: Administrative operations (requires admin role)
  - name: Webhooks
    description: Webhook configuration and delivery management
  - name: Audit Log
    description: Tamper-evident audit log (admin only)
  - name: Backups
    description: Backup management and scheduling (admin only)

paths:
  # ==================== Health Endpoints ====================
  /health:
    get:
      tags:
        - Health
      summary: Comprehensive health check
      description: |
        Returns detailed health status including storage metrics, database health,
        and system resource usage. Returns 503 if service is degraded or unhealthy.
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service is degraded or unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /health/live:
    get:
      tags:
        - Health
      summary: Liveness probe
      description: Fast health check for process aliveness (< 10ms). Use for Kubernetes liveness probes.
      operationId: getLiveness
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'

  /health/ready:
    get:
      tags:
        - Health
      summary: Readiness probe
      description: Check if service is ready to accept traffic. Use for Kubernetes readiness probes.
      operationId: getReadiness
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'

  /metrics:
    get:
      tags:
        - Health
      summary: Prometheus metrics
      description: Expose metrics in Prometheus format for monitoring and alerting.
      operationId: getMetrics
      responses:
        '200':
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string

  # ==================== Configuration Endpoints ====================
  /api/config:
    get:
      tags:
        - Configuration
      summary: Get public configuration
      description: Retrieve public-facing configuration for frontend clients.
      operationId: getPublicConfig
      responses:
        '200':
          description: Public configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicConfig'

  # ==================== Authentication Endpoints ====================
  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Create an authenticated session for a user account.
      operationId: userLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
              description: user_session cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Account disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/logout:
    post:
      tags:
        - Authentication
      summary: User logout
      description: End the current user session.
      operationId: userLogout
      security:
        - sessionAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/user:
    get:
      tags:
        - Authentication
      summary: Get current user
      description: Retrieve information about the currently authenticated user.
      operationId: getCurrentUser
      security:
        - sessionAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Current user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/change-password:
    post:
      tags:
        - Authentication
      summary: Change password
      description: Update the current user's password.
      operationId: changePassword
      security:
        - sessionAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed successfully
        '400':
          description: Password validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Current password incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== File Upload Endpoints ====================
  /api/upload:
    post:
      tags:
        - Files
      summary: Upload file
      description: |
        Upload a file and receive a unique claim code. For files under the chunked 
        upload threshold (default: 100MB).
        
        Authentication is optional unless `REQUIRE_AUTH_FOR_UPLOAD` is enabled.
      operationId: uploadFile
      security:
        - {}
        - sessionAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload
                expires_in_hours:
                  type: number
                  description: Hours until expiration (default 24, 0 = never expire)
                  example: 48
                max_downloads:
                  type: integer
                  description: Maximum downloads (0 = unlimited)
                  example: 5
                password:
                  type: string
                  description: Password protection for the file
                  format: password
      responses:
        '201':
          description: Upload successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          description: Invalid parameters or missing file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authentication required (if REQUIRE_AUTH_FOR_UPLOAD=true)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '408':
          description: |
            The request body stopped arriving for 60 seconds, or averaged under
            4 KiB/s (`code: UPLOAD_TIMEOUT`). Retry the upload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: File exceeds MAX_FILE_SIZE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            Malware scan rejected the upload (see ADR-015). `code` is
            `MALWARE_DETECTED` (the file was scanned and found infected; no
            claim code is ever issued) or `UNSCANNABLE_UPLOAD` (the file
            can't be scanned — end-to-end encrypted or over the scan size
            limit — and this server requires scannable uploads).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: |
            Malware scanning is enabled but the scanner could not be reached
            (`code: SCAN_UNAVAILABLE`). Retry after the delay in the
            `Retry-After` header.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '507':
          description: Disk full or quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== Chunked Upload Endpoints ====================
  /api/upload/init:
    post:
      tags:
        - Chunked Upload
      summary: Initialize chunked upload
      description: |
        Initialize a chunked upload session for large files (>= CHUNKED_UPLOAD_THRESHOLD).
        Returns an upload_id to use for subsequent chunk uploads.
      operationId: initChunkedUpload
      security:
        - {}
        - sessionAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChunkedUploadInitRequest'
      responses:
        '201':
          description: Upload session initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkedUploadInitResponse'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Total size exceeds limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded (same limit as `/api/upload`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Chunked uploads disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '507':
          description: |
            The upload's full size does not fit in the remaining storage quota
            (`code: QUOTA_EXCEEDED`) or disk space (`code: INSUFFICIENT_STORAGE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/upload/chunk/{upload_id}/{chunk_number}:
    post:
      tags:
        - Chunked Upload
      summary: Upload chunk
      description: |
        Upload a single chunk of a file. Chunks can be uploaded in any order
        and are idempotent (same chunk can be re-uploaded safely).
      operationId: uploadChunk
      security:
        - {}
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - name: upload_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Upload session ID from init
        - name: chunk_number
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
          description: Zero-based chunk index
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - chunk
              properties:
                chunk:
                  type: string
                  format: binary
                  description: Chunk data
      responses:
        '200':
          description: Chunk uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkUploadResponse'
        '400':
          description: Invalid upload_id format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Upload session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Upload already completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '408':
          description: |
            The chunk body stopped arriving for 60 seconds, or averaged under
            4 KiB/s (`code: UPLOAD_TIMEOUT`). Re-send the chunk.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Upload session expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Chunk too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded (10x the upload limit)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '507':
          description: |
            Quota exceeded (`code: QUOTA_EXCEEDED`), e.g. the upload's
            reservation lapsed after an hour without progress and the quota has
            since filled, or disk full (`code: INSUFFICIENT_STORAGE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/upload/complete/{upload_id}:
    post:
      tags:
        - Chunked Upload
      summary: Complete chunked upload
      description: |
        Finalize a chunked upload and assemble the file. May return 202 Accepted
        for large files that require async processing.
      operationId: completeChunkedUpload
      security:
        - {}
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - name: upload_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Upload session ID from init
      responses:
        '200':
          description: Upload complete (synchronous or already completed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '202':
          description: Assembly in progress (async)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncUploadResponse'
        '400':
          description: Missing chunks or invalid upload_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Upload session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >
            Assembly failed terminally (ADR-016): not retryable, or the
            ASSEMBLY_MAX_ATTEMPTS budget is exhausted. `code` carries the
            same machine-readable reason as UploadStatusResponse.error_code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/upload/status/{upload_id}:
    get:
      tags:
        - Chunked Upload
      summary: Check upload status
      description: Check the status of a chunked upload session.
      operationId: getUploadStatus
      security:
        - {}
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - name: upload_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Upload session ID from init
      responses:
        '200':
          description: Upload status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadStatusResponse'
        '404':
          description: Upload session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: |
            Rate limit exceeded: 600x `RATE_LIMIT_UPLOAD` per hour per IP (never
            under 6000/hour). Clients polling this endpoint should keep polling
            through a 429 rather than treating it as an upload failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== File Download Endpoints ====================
  /api/claim/{code}:
    get:
      tags:
        - Files
      summary: Download file
      description: |
        Download a file using its claim code. Supports HTTP Range requests for
        resumable downloads. If file is password-protected, provide password
        via query parameter.
      operationId: downloadFile
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: File claim code
        - name: password
          in: query
          required: false
          schema:
            type: string
          description: Password for protected files
        - name: X-Download-Session
          in: header
          required: false
          schema:
            type: string
          description: |
            Opaque bearer token from a previous response's X-Download-Session
            header. Only meaningful for files with max_downloads set (ADR-014):
            send it back on a resumed Range request so the download is
            recognised as a continuation of the same session and counts once,
            not once per request. Unrecognised, foreign, or expired tokens are
            silently treated as a fresh download rather than rejected.
      responses:
        '200':
          description: File content
          headers:
            Content-Type:
              schema:
                type: string
              description: File MIME type
            Content-Disposition:
              schema:
                type: string
              description: 'attachment; filename="original_name.pdf"'
            Content-Length:
              schema:
                type: integer
              description: File size in bytes
            Accept-Ranges:
              schema:
                type: string
              description: bytes
            X-Download-Session:
              schema:
                type: string
              description: >-
                Present only for files with max_downloads set. Echo back as a
                request header on a resumed Range request.
            Cache-Control:
              schema:
                type: string
              description: >-
                'private, no-store' on files with max_downloads set — the
                response depends on per-recipient session state.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Partial content (Range request)
          headers:
            Content-Range:
              schema:
                type: string
              description: 'bytes 0-999/10000'
            X-Download-Session:
              schema:
                type: string
              description: >-
                Present only for files with max_downloads set. Echo back as a
                request header on the next Range request to resume the same
                session.
            Cache-Control:
              schema:
                type: string
              description: >-
                'private, no-store' on files with max_downloads set.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: Password required or incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Invalid claim code or file expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Download limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '416':
          description: Invalid byte range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/claim/{code}/info:
    get:
      tags:
        - Files
      summary: Get file info
      description: Retrieve file metadata without downloading.
      operationId: getFileInfo
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: File claim code
        - name: password
          in: query
          required: false
          schema:
            type: string
          description: Password for protected files
      responses:
        '200':
          description: File metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileInfoResponse'
        '401':
          description: Password required or incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Invalid claim code or file expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== User File Management Endpoints ====================
  /api/user/files:
    get:
      tags:
        - User Files
      summary: List user's files
      description: Retrieve paginated list of files uploaded by the current user.
      operationId: listUserFiles
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
          description: Number of results per page
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Pagination offset
      responses:
        '200':
          description: List of user's files
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserFilesResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/user/files/delete:
    delete:
      tags:
        - User Files
      summary: Delete user's file
      description: Delete a file owned by the current user.
      operationId: deleteUserFile
      security:
        - sessionAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - file_id
              properties:
                file_id:
                  type: integer
                  description: File ID to delete
      responses:
        '200':
          description: File deleted successfully
        '403':
          description: File not owned by user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/user/files/rename:
    post:
      tags:
        - User Files
      summary: Rename user's file
      description: Change the original filename of a user's uploaded file.
      operationId: renameUserFile
      security:
        - sessionAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - file_id
                - new_filename
              properties:
                file_id:
                  type: integer
                  description: File ID to rename
                new_filename:
                  type: string
                  description: New filename
                  example: updated-document.pdf
      responses:
        '200':
          description: File renamed successfully
        '400':
          description: Invalid filename
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: File not owned by user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/user/files/update-expiration:
    post:
      tags:
        - User Files
      summary: Update file expiration
      description: Modify the expiration time of a user's uploaded file.
      operationId: updateFileExpiration
      security:
        - sessionAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - file_id
                - expires_in_hours
              properties:
                file_id:
                  type: integer
                  description: File ID to update
                expires_in_hours:
                  type: number
                  description: New expiration in hours from now
                  example: 72
      responses:
        '200':
          description: Expiration updated successfully
        '400':
          description: Invalid expiration value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: File not owned by user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/user/files/regenerate-claim-code:
    post:
      tags:
        - User Files
      summary: Regenerate claim code
      description: Generate a new claim code for a user's uploaded file. Old code becomes invalid.
      operationId: regenerateClaimCode
      security:
        - sessionAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - file_id
              properties:
                file_id:
                  type: integer
                  description: File ID to regenerate code for
      responses:
        '200':
          description: New claim code generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  claim_code:
                    type: string
                    description: New claim code
                  download_url:
                    type: string
                    description: New download URL
        '403':
          description: File not owned by user
          content:
