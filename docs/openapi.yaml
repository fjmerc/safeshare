        id:
          type: integer
        user_id:
          type: integer
        username:
          type: string
        name:
          type: string
        token_prefix:
          type: string
        scopes:
          type: array
          items:
            type: string
        last_used_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    # ==================== Admin Schemas ====================
    DashboardResponse:
      type: object
      properties:
        stats:
          $ref: '#/components/schemas/DashboardStats'
        files:
          type: array
          items:
            $ref: '#/components/schemas/AdminFile'
        blocked_ips:
          type: array
          items:
            $ref: '#/components/schemas/BlockedIP'
        total_files:
          type: integer

    DashboardStats:
      type: object
      properties:
        total_files:
          type: integer
        storage_used_bytes:
          type: integer
          format: int64
        quota_used_percent:
          type: number
        blocked_ips_count:
          type: integer
        partial_upload_size_bytes:
          type: integer
          format: int64
        total_users:
          type: integer

    AdminFile:
      type: object
      properties:
        id:
          type: integer
        claim_code:
          type: string
        original_filename:
          type: string
        file_size:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        download_count:
          type: integer
        max_downloads:
          type: integer
          nullable: true
        uploader_ip:
          type: string
        user_id:
          type: integer
          nullable: true
        username:
          type: string
          nullable: true

    BlockedIP:
      type: object
