          format: int64
        chunked_upload_threshold:
          type: integer
          format: int64
        encryption_enabled:
          type: boolean
        max_file_size:
          type: integer
          format: int64
        read_timeout:
          type: integer
        write_timeout:
          type: integer

    StorageSettingsRequest:
      type: object
      properties:
        quota_gb:
          type: integer
          description: Storage quota in GB
        max_file_size_bytes:
          type: integer
          format: int64
        default_expiration_hours:
          type: integer
        max_expiration_hours:
          type: integer

    SecuritySettingsRequest:
      type: object
      properties:
        rate_limit_upload:
          type: integer
        rate_limit_download:
          type: integer
