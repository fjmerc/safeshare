# Docker Compose file for MinIO integration tests (SH-2.2 streaming S3 decrypt)
# Usage: docker-compose -f docker-compose.minio-test.yml up -d --wait
#
# Brings up a single MinIO service. Bucket creation is done by the test
# harness (scripts/test-minio.sh) after MinIO is healthy — keeping it out of
# the compose file lets `--wait` work cleanly (a one-shot init container that
# exits-0 is treated as "not started" by `docker compose --wait`).

services:
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: safeshare-minio-test
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9100:9000"
      - "9101:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    tmpfs:
      # tmpfs keeps test runs fast and ensures a clean bucket on restart.
      - /data
