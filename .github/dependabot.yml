version: 2
updates:
  # Go modules - main application
  - package-ecosystem: "gomod"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "go"
    groups:
      # Group AWS SDK updates to reduce PR noise
      aws-sdk:
        patterns:
          - "github.com/aws/aws-sdk-go-v2*"
      # Group golang.org/x/* packages
      golang-x:
        patterns:
          - "golang.org/x/*"
    open-pull-requests-limit: 10

  # Go modules - SDK submodule
  - package-ecosystem: "gomod"
    directory: "/sdk/go"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    commit-message:
      prefix: "deps(sdk)"
    labels:
      - "dependencies"
      - "go"
      - "sdk"
    open-pull-requests-limit: 5

  # npm - TypeScript SDK
  - package-ecosystem: "npm"
    directory: "/sdk/typescript"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    commit-message:
      prefix: "deps(sdk)"
    labels:
      - "dependencies"
      - "javascript"
      - "sdk"
    ignore:
      # tsup vendors rollup-plugin-dts pre-bundled against TypeScript 5.x and
      # calls compiler internals removed in TS 7, so `dts: true` builds crash.
      # Revisit once tsup ships TS 7 support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    commit-message:
      prefix: "deps(docker)"
    labels:
      - "dependencies"
      - "docker"
    open-pull-requests-limit: 5

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    commit-message:
      prefix: "deps(actions)"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5
